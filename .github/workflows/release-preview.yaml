name: Release Preview

on:
  workflow_call:

jobs:
  preview:
    name: Preview Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Simulate merge to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff origin/${{ github.event.pull_request.head.ref }} -m "temp: simulate PR merge for release preview"
          echo "Current branch: $(git branch --show-current)"
          echo "Latest commits:"
          git log --oneline -5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release
        run: |
          npm install --save-dev semantic-release@18.0.0 \
            @semantic-release/commit-analyzer@9.0.2 \
            @semantic-release/release-notes-generator@10.0.3 \
            conventional-changelog-conventionalcommits@4.6.3

      - name: Create preview config
        run: |
          # Create a config without GitHub plugin for preview (avoids token validation)
          cat > .releaserc.preview.json << 'EOF'
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator"
            ]
          }
          EOF

      - name: Run semantic-release (dry-run)
        id: semantic
        run: |
          # Temporarily rename main config to use preview config only
          mv .releaserc.json .releaserc.json.bak

          # Run semantic-release in dry-run mode with preview config only
          OUTPUT=$(npx semantic-release --extends ./.releaserc.preview.json --dry-run --no-ci 2>&1 || true)
          echo "$OUTPUT"

          # Restore main config
          mv .releaserc.json.bak .releaserc.json

          # Extract version information
          NEW_VERSION=$(echo "$OUTPUT" | grep -Eo "The next release version is [0-9]+\.[0-9]+\.[0-9]+" | grep -Eo "[0-9]+\.[0-9]+\.[0-9]+" || echo "")
          RELEASE_TYPE=$(echo "$OUTPUT" | grep -Eo "Analysis of [0-9]+ commits complete: [a-z]+ release" | grep -Eo "(major|minor|patch) release" | sed 's/ release//' || echo "")

          # Save to outputs
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

          # Save full output for comment
          echo "full_output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Display Preview
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "          RELEASE PREVIEW"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          if [ -n "${{ steps.semantic.outputs.new_version }}" ]; then
            echo "Version:      v${{ steps.semantic.outputs.new_version }}"
            echo "Release Type: ${{ steps.semantic.outputs.release_type }}"
            echo "Status:       Release will be published"
          else
            echo "Status:       No release will be published"
            echo "Reason:       No relevant changes detected"
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const newVersion = '${{ steps.semantic.outputs.new_version }}';
            const releaseType = '${{ steps.semantic.outputs.release_type }}';

            let body;
            if (newVersion) {
              body = `## Release Preview

              **Version:** \`v${newVersion}\`
              **Release Type:** \`${releaseType}\`
              **Status:** Release will be published when merged to main

              <details>
              <summary> View semantic-release analysis</summary>

              \`\`\`
              ${{ steps.semantic.outputs.full_output }}
              \`\`\`
              </details>

              ---
              *This preview is generated by semantic-release dry-run mode*`;
            } else {
              body = `## Release Preview

              **Status:** No release will be published
              **Reason:** No relevant changes detected

              <details>
              <summary> View semantic-release analysis</summary>

              \`\`\`
              ${{ steps.semantic.outputs.full_output }}
              \`\`\`
              </details>

              ---
              *This preview is generated by semantic-release dry-run mode*`;
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Release Preview')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
