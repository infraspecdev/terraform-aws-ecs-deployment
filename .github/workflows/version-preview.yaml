name: 'Version Preview'

on:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Git State
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo ""
          echo "Latest 5 commits:"
          git log --oneline -5
          echo ""
          echo "Latest tag:"
          git describe --tags --abbrev=0 || echo "No tags found"
          echo ""
          echo "Commits since last tag:"
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD --oneline || echo "Cannot determine"

      - name: Semantic Release (Dry Run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 18.0.0
          dry_run: true
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'master',
              {
                name: '*',
                prerelease: true
              }
            ]
          extra_plugins: |
            @semantic-release/changelog@6.0.0
            @semantic-release/git@10.0.0
            conventional-changelog-conventionalcommits@4.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: release-preview
          message: |
            ## Release Preview

            ${{ steps.semantic.outputs.new_release_published == 'true' && format('**Release Type:** `{0}`
            **Next Version:** `v{1}`

            ### Release Notes
            {2}

            ---
            *This shows what release will be created when this PR is merged.*', steps.semantic.outputs.new_release_type, steps.semantic.outputs.new_release_version, steps.semantic.outputs.new_release_notes) || 'No new release will be created from this PR.

            This PR does not contain conventional commits that trigger a release.' }}
