name: 'Version Preview'

on:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Preview Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create temporary branch
        run: |
          echo "Current state: detached HEAD"
          echo "Creating temporary branch for semantic-release..."
          git checkout -b temp-preview-branch
          echo "Now on branch: $(git branch --show-current)"

      - name: Semantic Release (Dry Run)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 18.0.0
          dry_run: true
          branches: |
            [
              'temp-preview-branch'
            ]
          extra_plugins: |
            @semantic-release/changelog@6.0.0
            @semantic-release/git@10.0.0
            conventional-changelog-conventionalcommits@4.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: release-preview
          message: |
            ## Release Preview

            ${{ steps.semantic.outputs.new_release_published == 'true' && format('**Release Type:** `{0}`
            **Next Version:** `v{1}`

            ### Release Notes
            {2}

            ---
            *This shows what release will be created when this PR is merged.*', steps.semantic.outputs.new_release_type, steps.semantic.outputs.new_release_version, steps.semantic.outputs.new_release_notes) || 'No new release will be created from this PR.

            This PR does not contain conventional commits that trigger a release.' }}
