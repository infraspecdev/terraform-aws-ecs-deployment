name: Terraform Master Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request_target:
    branches:
      - main
      - master
    types:
      - opened
      - edited
      - synchronize
  pull_request:
    branches:
      - main
      - master
jobs:
  prTitlecheck:
    name: PR title check
    if: ${{ github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/pr-title.yaml

  versionPreview:
    name: Version Preview
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/version-preview.yaml

  preCommitCheck:
    name: Terraform Checks
    uses: ./.github/workflows/terraform-checks.yaml

  generateDocs:
    name: Generate Terraform Docs
    needs: preCommitCheck
    uses: ./.github/workflows/terraform-docs.yaml

  release:
    name: Release module
    needs: generateDocs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release.yaml
